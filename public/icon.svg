<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pixel-art style gold stack -->
  <g>
    <!-- Main gold bars -->
    <rect x="8" y="36" width="10" height="18" fill="#e6c200" stroke="#b8860b" stroke-width="2"/>
    <rect x="20" y="28" width="12" height="26" fill="#ffe066" stroke="#b8860b" stroke-width="2"/>
    <rect x="34" y="20" width="12" height="34" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
    <rect x="48" y="12" width="8" height="42" fill="#e6c200" stroke="#b8860b" stroke-width="2"/>
    <!-- Small coin -->
    <rect x="14" y="56" width="6" height="4" fill="#ffe066" stroke="#b8860b" stroke-width="2"/>
    <!-- Shadows -->
    <rect x="8" y="54" width="10" height="2" fill="#b8860b" opacity="0.5"/>
    <rect x="20" y="52" width="12" height="2" fill="#b8860b" opacity="0.5"/>
    <rect x="34" y="50" width="12" height="2" fill="#b8860b" opacity="0.5"/>
    <rect x="48" y="48" width="8" height="2" fill="#b8860b" opacity="0.5"/>
  </g>
  <!-- 2147M text in pixel font style -->
  <text x="6" y="18" font-family="monospace" font-size="18" font-weight="bold" fill="#00ffb0" stroke="#003f2f" stroke-width="1" paint-order="stroke" style="letter-spacing:2px;">2147M</text>
</svg>